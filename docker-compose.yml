services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: restaurant_db
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - restaurant-net

  backend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    volumes:
      - ./backend:/app
      - backend-modules:/app/node_modules
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - restaurant-net

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    env_file:
      - frontend/.env
    ports:
      - "5173:5173"
    networks:
      - restaurant-net

  chatbot:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt -q && uvicorn main:app --host 0.0.0.0 --port 8002 --reload"
    volumes:
      - ./ai/service-chatbot:/app
    env_file:
      - ai/service-chatbot/.env
    ports:
      - "8002:8002"
    depends_on:
      - postgres
    networks:
      - restaurant-net

volumes:
  pg-data:
  backend-modules:
  frontend-modules:

networks:
  restaurant-net:
    driver: bridge
